<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>24/7 Stream Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent;
      font-family: 'Arial Black', Impact, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      color: #fff;
    }

    /* RIGHT COLUMN CONTAINER */
    .right-sidebar {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: stretch;
    }

    /* SCROLLING BANNERS */
    .banner-card {
      position: relative;
      height: 75px;
      border-radius: 12px;
      overflow: hidden;
      background-color: #111;
      
      /* Metallic Blue/Aqua Tubular Border */
      border: 4px solid #00d2ff;
      box-shadow: 
        inset 0 0 6px #0088cc,
        0 0 10px rgba(0, 210, 255, 0.6),
        inset 2px 2px 3px rgba(255, 255, 255, 0.8),
        inset -2px -2px 3px rgba(0, 0, 0, 0.8);
    }

    /* Background GIF Container inside Banners */
    .banner-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      opacity: 0.6; /* Adjust opacity to make red text pop */
    }

    .marquee-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
    }

    .marquee-text {
      display: inline-block;
      font-size: 24px;
      font-weight: 900;
      color: #ff1100; /* Big Red Text */
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 2px 2px 4px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      padding-left: 100%;
      animation: marquee 12s linear infinite;
    }

    @keyframes marquee {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    /* TIMERS CONTAINER */
    .timers-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }

    .timer-card {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      background: rgba(20, 20, 30, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 8px 14px;
    }

    .icon-box {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-icon {
      object-fit: contain;
    }

    /* MAIN 5-MIN TIMER (BIGGER, BOLD BLACK) */
    .timer-main {
      border: 3px solid #ffcc00;
      background: rgba(255, 204, 0, 0.9);
      padding: 12px 16px;
    }

    .timer-main .timer-text {
      font-size: 38px;
      font-weight: 900;
      color: #000000; /* Bold Black Text */
      text-shadow: none;
    }

    .timer-main .timer-icon {
      width: 48px;
      height: 48px;
    }

    /* SECONDARY 30-MIN TIMERS (WHITE TEXT, BLACK OUTLINE) */
    .timer-secondary .timer-text {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff; /* White Text */
      text-shadow: 
        -2px -2px 0 #000,  
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
         0px  3px 5px rgba(0,0,0,0.8); /* Black Outline */
    }

    .timer-secondary .timer-icon {
      width: 36px;
      height: 36px;
    }
  </style>
</head>
<body>

  <div class="right-sidebar">
    
    <!-- BANNER 1 (SPANISH) -->
    <div class="banner-card">
      <!-- Replace with your GIF URL or local file -->
      <img class="banner-bg" src="banner1_bg.gif" alt="Banner 1 BG">
      <div class="marquee-wrapper">
        <div class="marquee-text">
          ¿Buscas alguna fusión? Deja tu user y un comentario.
        </div>
      </div>
    </div>

    <!-- BANNER 2 (ENGLISH) -->
    <div class="banner-card">
      <!-- Replace with your GIF URL or local file -->
      <img class="banner-bg" src="banner2_bg.gif" alt="Banner 2 BG">
      <div class="marquee-wrapper">
        <div class="marquee-text">
          Looking for a merge? Leave your user and a comment.
        </div>
      </div>
    </div>

    <!-- TIMERS SECTION -->
    <div class="timers-container">

      <!-- MAIN 5-MINUTE GAME TIMER (BIGGEST) -->
      <div class="timer-card timer-main">
        <div class="icon-box">
          <img id="main-icon" class="timer-icon" src="sun_icon.png" alt="Main Icon">
        </div>
        <div id="main-timer-text" class="timer-text">05:00</div>
      </div>

      <!-- TIMER 1 (30-MIN EVENT SPAWN A) -->
      <div class="timer-card timer-secondary">
        <div class="icon-box">
          <img id="event1-icon" class="timer-icon" src="game_icon1.jpg" alt="Event 1 Icon">
        </div>
        <div id="timer1-text" class="timer-text">30:00</div>
      </div>

      <!-- TIMER 2 (30-MIN EVENT SPAWN B) -->
      <div class="timer-card timer-secondary">
        <div class="icon-box">
          <img id="event2-icon" class="timer-icon" src="game_icon2.jpg" alt="Event 2 Icon">
        </div>
        <div id="timer2-text" class="timer-text">30:00</div>
      </div>

    </div>

  </div>

  <script>
    // ICON CONFIGURATION
    // You can replace these image links with your own local file paths or web links
    const SUN_ICON = 'https://img.icons8.com/emoji/96/sun-emoji.png';
    const MOON_ICON = 'https://img.icons8.com/emoji/96/cloud-with-lightning-and-rain.png'; // or moon/cloud icon

    function updateTimers() {
      const now = new Date();
      const totalSeconds = (now.getMinutes() * 60) + now.getSeconds();

      // ========================================================
      // 1. MAIN 5-MINUTE TIMER (Starts 5s before :00, :05, :10...)
      // ========================================================
      const offsetMain = (totalSeconds + 5) % 300; // 300s = 5 minutes
      const mainRemaining = 300 - offsetMain;

      const mainMins = Math.floor(mainRemaining / 60);
      const mainSecs = mainRemaining % 60;
      document.getElementById('main-timer-text').innerText = 
        `${String(mainMins).padStart(2, '0')}:${String(mainSecs).padStart(2, '0')}`;

      // Dynamic Icon Logic from Video:
      // 5:00 to 4:49 (Top 11 secs) = SUN ICON
      // 4:50 to 0:00 = MOON ICON
      const mainIconEl = document.getElementById('main-icon');
      if (mainRemaining > 289) { // 289s is 4:49
        mainIconEl.src = SUN_ICON;
      } else {
        mainIconEl.src = MOON_ICON;
      }

      // ========================================================
      // 2. TIMER 1 (30-Min Event - Starts 5s before :15 & :45)
      // ========================================================
      // Shift timeline by 15 mins (900s) + 5s offset
      const offsetTimer1 = (totalSeconds + 900 + 5) % 1800; // 1800s = 30 minutes
      const t1Remaining = 1800 - offsetTimer1;

      const t1Mins = Math.floor(t1Remaining / 60);
      const t1Secs = t1Remaining % 60;
      document.getElementById('timer1-text').innerText = 
        `${String(t1Mins).padStart(2, '0')}:${String(t1Secs).padStart(2, '0')}`;

      // ========================================================
      // 3. TIMER 2 (30-Min Event - Starts 5s before :00 & :30)
      // ========================================================
      // Shift timeline by 5s offset
      const offsetTimer2 = (totalSeconds + 5) % 1800;
      const t2Remaining = 1800 - offsetTimer2;

      const t2Mins = Math.floor(t2Remaining / 60);
      const t2Secs = t2Remaining % 60;
      document.getElementById('timer2-text').innerText = 
        `${String(t2Mins).padStart(2, '0')}:${String(t2Secs).padStart(2, '0')}`;
    }

    // Run immediately and update every second
    updateTimers();
    setInterval(updateTimers, 1000);
  </script>
</body>
</html>
