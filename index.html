<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>24/7 Stream Overlay - Master Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: transparent; 
      font-family: 'Arial Black', Impact, sans-serif; 
      overflow: hidden; 
      width: 100vw; 
      height: 100vh; 
      color: #fff; 
    }

    /* RIGHT SIDEBAR: BANNERS & TIMERS */
    .right-sidebar { 
      position: absolute; 
      top: 20px; 
      right: 20px; 
      width: 380px; 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
      z-index: 10;
    }

    /* GLASSY METALLIC BLUE THEME */
    .glass-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(180deg, #1b385e 0%, #0d1e36 50%, #091322 100%);
      border: 3px solid #6b82a0;
      box-shadow: 
        0 0 0 1px #050a12,
        inset 0 1px 2px rgba(255, 255, 255, 0.6),
        inset 0 -2px 4px rgba(0, 0, 0, 0.8),
        0 8px 16px rgba(0, 0, 0, 0.6);
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 45%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 100%);
      border-radius: 12px 12px 100% 100% / 12px 12px 10px 10px;
      pointer-events: none;
      z-index: 3;
    }

    .banner-card { height: 75px; }
    .banner-bg { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      object-fit: cover; z-index: 1; opacity: 0.45; mix-blend-mode: overlay;
    }
    .marquee-wrapper { 
      position: relative; z-index: 2; width: 100%; height: 100%; 
      display: flex; align-items: center; overflow: hidden; white-space: nowrap; 
    }
    .marquee-text { 
      display: inline-block; font-size: 22px; font-weight: 900; color: #ffffff; 
      text-transform: uppercase; letter-spacing: 1px; text-shadow: 2px 2px 4px #000; 
      padding-left: 100%; animation: marquee 12s linear infinite; 
    }
    @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

    .timer-card { display: flex; align-items: center; justify-content: flex-start; gap: 14px; padding: 12px 16px; }
    .icon-box { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex-shrink: 0; z-index: 4; }
    .timer-icon { width: 100%; height: 100%; object-fit: contain; }

    .timer-main { background: linear-gradient(180deg, #ffd700 0%, #cca300 50%, #997a00 100%); border-color: #ffe680; }
    .timer-main .timer-text { font-size: 38px; font-weight: 900; color: #000000; z-index: 4; }
    .timer-secondary .timer-text { font-size: 28px; font-weight: 800; color: #ffffff; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; z-index: 4; }
    .timer-secondary .icon-box { width: 36px; height: 36px; }

    /* CENTER TOP: EGG ALERTS FEED (Spans wider since left sidebar is gone) */
    .egg-alert-container {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 420px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      z-index: 5;
      overflow-x: auto;
      padding-bottom: 10px;
    }
    
    .egg-card {
      width: 140px;
      height: 140px;
      flex-shrink: 0;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      position: relative;
      box-shadow: 0 6px 12px rgba(0,0,0,0.7);
    }

    .card-divine {
      background: linear-gradient(180deg, #ffe066 0%, #b8860b 100%);
      border: 3px solid #ffea9f;
      color: #000;
    }
    .card-eternal {
      background: linear-gradient(180deg, #4b0082 0%, #1a0033 100%);
      border: 3px solid #8a2be2;
      color: #fff;
    }
    .card-secret {
      background: linear-gradient(180deg, #2c2c2c 0%, #111111 100%);
      border: 3px solid #444444;
      color: #fff;
    }

    .egg-title { font-size: 13px; font-weight: 900; text-align: center; line-height: 1.1; }
    .egg-img { width: 50px; height: 50px; object-fit: contain; }
    .spawn-badge-now {
      background: #ff0000;
      color: #ffff00;
      font-weight: 900;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid #fff;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- CENTER TOP: EGG ALERTS FEED -->
  <div class="egg-alert-container" id="egg-alert-container"></div>

  <!-- RIGHT SIDEBAR: BANNERS & TIMERS -->
  <div class="right-sidebar">
    <div class="glass-card banner-card">
      <img class="banner-bg" src="banner1_bg.gif" alt="" onerror="this.style.display='none'">
      <div class="marquee-wrapper">
        <div class="marquee-text">¿Buscas alguna fusión? Deja tu user y un comentario.</div>
      </div>
    </div>

    <div class="glass-card banner-card">
      <img class="banner-bg" src="banner2_bg.gif" alt="" onerror="this.style.display='none'">
      <div class="marquee-wrapper">
        <div class="marquee-text">Looking for a merge? Leave your user and a comment.</div>
      </div>
    </div>

    <!-- MAIN DYNAMIC CLOCK TIMER -->
    <div class="glass-card timer-card timer-main">
      <div class="icon-box">
        <img id="main-icon" class="timer-icon" src="sun_icon.jpg" alt="Main Icon" onerror="this.style.display='none'">
      </div>
      <div id="main-timer-text" class="timer-text">00:00</div>
    </div>

    <!-- SPAWN COUNTDOWN TIMER 1 -->
    <div class="glass-card timer-card timer-secondary">
      <div class="icon-box">
        <img class="timer-icon" src="game_icon1.jpg" alt="Event 1" onerror="this.style.display='none'">
      </div>
      <div id="timer1-text" class="timer-text">05:00</div>
    </div>

    <!-- SPAWN COUNTDOWN TIMER 2 -->
    <div class="glass-card timer-card timer-secondary">
      <div class="icon-box">
        <img class="timer-icon" src="game_icon2.jpg" alt="Event 2" onerror="this.style.display='none'">
      </div>
      <div id="timer2-text" class="timer-text">05:00</div>
    </div>
  </div>

  <script>
    // --- LIVE TICKING TIMERS ---
    function updateTimers() {
      const now = new Date();
      
      // Main Clock (Local Time HH:MM:SS or HH:MM)
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('main-timer-text').innerText = `${hours}:${minutes}:${seconds}`;

      // 5-Minute Spawn Wave Countdowns (counts down every 5 minutes)
      const secInto5Min = (now.getMinutes() % 5) * 60 + now.getSeconds();
      const secRemaining = 300 - secInto5Min; // 300 seconds = 5 minutes
      const remMin = String(Math.floor(secRemaining / 60)).padStart(2, '0');
      const remSec = String(secRemaining % 60).padStart(2, '0');
      
      const countdownStr = `${remMin}:${remSec}`;
      document.getElementById('timer1-text').innerText = countdownStr;
      document.getElementById('timer2-text').innerText = countdownStr;
    }

    setInterval(updateTimers, 1000);
    updateTimers();

    // --- LIVE WEBHOOK SYNC FOR EGG CARDS ---
    async function fetchAlerts() {
      try {
        const response = await fetch('http://localhost:3000/alerts');
        const alerts = await response.json();
        
        if (alerts.length === 0) return;

        const container = document.getElementById('egg-alert-container');
        container.innerHTML = alerts.map(alert => {
          const typeClass = alert.type ? alert.type.toLowerCase() : 'secret';
          return `
            <div class="egg-card card-${typeClass}">
              <div class="egg-title">${alert.name}</div>
              <img class="egg-img" src="${alert.img}" alt="" onerror="this.style.display='none'">
              <div class="spawn-badge-now">${alert.location}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        // Fallback if offline
      }
    }

    setInterval(fetchAlerts, 2000);
    fetchAlerts();
  </script>
</body>
</html>
