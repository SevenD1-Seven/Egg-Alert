<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>24/7 Stream Overlay - Master Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* TRANSPARENT BACKGROUND FOR LIVE STREAM FEED */
    body { 
      background: transparent;
      font-family: 'Arial Black', Impact, sans-serif; 
      overflow: hidden; 
      width: 100vw; 
      height: 100vh; 
      color: #fff; 
    }

    /* RIGHT SIDEBAR: BANNERS & TIMERS */
    .right-sidebar { 
      position: absolute; 
      top: 20px; 
      right: 20px; 
      width: 380px; 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
      z-index: 10;
    }

    /* GLASSY METALLIC BLUE THEME */
    .glass-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(27, 56, 94, 0.55) 0%, rgba(13, 30, 54, 0.65) 50%, rgba(9, 19, 34, 0.75) 100%);
      backdrop-filter: blur(4px);
      border: 3px solid rgba(107, 130, 160, 0.6);
      box-shadow: 
        0 0 0 1px rgba(5, 10, 18, 0.4),
        inset 0 1px 2px rgba(255, 255, 255, 0.4),
        inset 0 -2px 4px rgba(0, 0, 0, 0.5),
        0 8px 16px rgba(0, 0, 0, 0.4);
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 45%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.02) 100%);
      border-radius: 12px 12px 100% 100% / 12px 12px 10px 10px;
      pointer-events: none;
      z-index: 3;
    }

    .banner-card { height: 75px; }
    .banner-bg { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      object-fit: cover; z-index: 1; opacity: 0.35; mix-blend-mode: overlay;
    }
    .marquee-wrapper { 
      position: relative; z-index: 2; width: 100%; height: 100%; 
      display: flex; align-items: center; overflow: hidden; white-space: nowrap; 
    }
    .marquee-text { 
      display: inline-block; font-size: 22px; font-weight: 900; color: #ffffff; 
      text-transform: uppercase; letter-spacing: 1px; text-shadow: 2px 2px 4px #000; 
      padding-left: 100%; animation: marquee 12s linear infinite; 
    }
    @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

    /* HIGHLIGHTED BANNER WORDS */
    .highlight-word {
      color: #ff3333;
      font-size: 26px;
      font-weight: 900;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 10px #ff0000;
    }

    /* STABLE TIMER CARDS */
    .timer-card { 
      height: 75px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 16px; 
    }
    .timer-left { display: flex; align-items: center; gap: 12px; }
    
    .icon-box { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      width: 64px; 
      height: 64px; 
      flex-shrink: 0; 
      z-index: 4; 
    }
    .timer-icon { 
      width: 120%; 
      height: 120%; 
      object-fit: contain; 
    }

    /* STACKED BILINGUAL HEADER WORDS */
    .bilingual-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      z-index: 4;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .lang-top { font-size: 11px; font-weight: 900; color: #ffdd44; text-transform: uppercase; }
    .lang-bot { font-size: 11px; font-weight: 900; color: #ffffff; text-transform: uppercase; }

    /* TOP TIMER DEFAULT (GLASSY BANNER STYLE FOR 0-10s) */
    .timer-main { 
      background: linear-gradient(180deg, rgba(27, 56, 94, 0.55) 0%, rgba(13, 30, 54, 0.65) 50%, rgba(9, 19, 34, 0.75) 100%); 
      border-color: rgba(107, 130, 160, 0.6);
    }
    .timer-main .timer-text { font-size: 36px; font-weight: 900; color: #ffffff; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; z-index: 4; letter-spacing: 1px; }

    /* STANDARD YELLOW STATE (10s to 15s) */
    .timer-main.yellow-state {
      background: linear-gradient(180deg, rgba(255, 215, 0, 0.7) 0%, rgba(204, 163, 0, 0.75) 50%, rgba(153, 122, 0, 0.8) 100%);
      border-color: #ffe680;
    }
    .timer-main.yellow-state .timer-text { color: #000000; text-shadow: none; font-size: 36px; font-weight: 900; }

    /* STEADY GLOWING STATE ON TOP TIMER (NO FLASHING) */
    .timer-main.glowing-state {
      background: linear-gradient(180deg, rgba(255, 215, 0, 0.7) 0%, rgba(204, 163, 0, 0.75) 50%, rgba(153, 122, 0, 0.8) 100%);
      box-shadow: 0 0 25px #ffd700, 0 0 50px rgba(255, 215, 0, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.9);
      border-color: #ffffff;
    }
    .timer-main.glowing-state .timer-text { color: #000000; text-shadow: none; font-size: 36px; font-weight: 900; }

    /* BOTTOM TIMER WITH FLASHING NEON GREEN ILLUMINATION */
    .timer-secondary {
      background: linear-gradient(180deg, rgba(27, 56, 94, 0.55) 0%, rgba(13, 30, 54, 0.65) 50%, rgba(9, 19, 34, 0.75) 100%);
      border-color: rgba(107, 130, 160, 0.6);
    }
    .timer-secondary.illuminated {
      background: linear-gradient(180deg, rgba(0, 255, 128, 0.7) 0%, rgba(0, 204, 102, 0.75) 50%, rgba(0, 153, 76, 0.8) 100%);
      border-color: #ffffff;
      animation: pulse-glow-green 1s ease-in-out infinite alternate;
    }
    @keyframes pulse-glow-green {
      0% { box-shadow: 0 0 15px #00ff80, inset 0 0 10px rgba(255,255,255,0.7); }
      100% { box-shadow: 0 0 35px #fff, 0 0 60px #00ff80, inset 0 0 20px rgba(255,255,255,1); }
    }

    .timer-secondary .timer-text { font-size: 34px; font-weight: 900; color: #ffffff; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; z-index: 4; letter-spacing: 1px; }
    .timer-secondary.illuminated .timer-text { color: #000000; text-shadow: none; font-size: 36px; font-weight: 900; }

    /* "NOW" BADGE */
    .now-badge {
      background: #ff2222;
      color: #ffffff;
      font-size: 16px;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      box-shadow: 0 0 12px #ff0000;
      animation: flash-now 0.8s infinite alternate;
      z-index: 4;
    }
    @keyframes flash-now {
      0% { opacity: 0.7; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <!-- RIGHT SIDEBAR: BANNERS & TIMERS -->
  <div class="right-sidebar">
    <div class="glass-card banner-card">
      <img class="banner-bg" src="banner1_bg.gif" alt="" onerror="this.style.display='none'">
      <div class="marquee-wrapper">
        <div class="marquee-text">¿Buscas alguna <span class="highlight-word">fusión</span>? Deja tu user y un comentario.</div>
      </div>
    </div>

    <div class="glass-card banner-card">
      <img class="banner-bg" src="banner2_bg.gif" alt="" onerror="this.style.display='none'">
      <div class="marquee-wrapper">
        <div class="marquee-text">Looking for a <span class="highlight-word">merge</span>? Leave your user and a comment.</div>
      </div>
    </div>

    <!-- TOP 5-MIN LOOPING TIMER -->
    <div id="main-timer-card" class="glass-card timer-card timer-main">
      <div class="timer-left">
        <div class="icon-box">
          <img id="main-icon" class="timer-icon" src="sun_icon.jpg" alt="Icon" onerror="this.style.display='none'">
        </div>
        <div class="bilingual-header">
          <span class="lang-top">en</span>
          <span class="lang-bot">in</span>
        </div>
        <div id="main-timer-text" class="timer-text">00:10</div>
      </div>
    </div>

    <!-- BOTTOM TIMER -->
    <div id="bottom-timer-card" class="glass-card timer-card timer-secondary">
      <div class="timer-left">
        <div class="icon-box">
          <img class="timer-icon" src="game_icon2.jpg" alt="Event 2" onerror="this.style.display='none'">
        </div>
        <div id="timer2-text" class="timer-text">30:00</div>
      </div>
      <div id="bottom-indicator-container"></div>
    </div>
  </div>

  <script>
    const globalOffsetSec = 13;    

    // Initialize tracking keys to current time blocks on startup so refreshes don't re-trigger past audio
    const initialTotalSec = new Date().getHours() * 3600 + new Date().getMinutes() * 60 + new Date().getSeconds() + globalOffsetSec;
    let lastAlertResetKey = Math.floor(initialTotalSec / 300);
    let lastAlert30SecKey = Math.floor(initialTotalSec / 300);
    let lastAlert445Key = Math.floor(initialTotalSec / 300);
    let lastBottomResetKey = Math.floor(initialTotalSec / 1800);

    function playAudio(filename) {
      const audio = new Audio(filename);
      audio.volume = 1.0;
      audio.play().catch(err => {
        console.log("Custom audio play blocked or missing file:", err);
      });
    }

    function updateTimers() {
      try {
        const now = new Date();
        const totalSecToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000 + globalOffsetSec;

        // --- 1. TOP 5-MIN TIMER ---
        const secInto5MinBlock = ((totalSecToday % 300) + 300) % 300;
        const rem5MinSec = 300 - secInto5MinBlock;
        const currentBlockId = Math.floor(totalSecToday / 300);

        // Audio Triggers for Top Timer
        if (secInto5MinBlock < 1 && lastAlertResetKey !== currentBlockId) {
          lastAlertResetKey = currentBlockId;
          playAudio('10segundos.mp3');
        }

        const rawFloorRem = Math.floor(rem5MinSec);
        if (rawFloorRem === 30 && lastAlert30SecKey !== currentBlockId) {
          lastAlert30SecKey = currentBlockId;
          playAudio('30segundos.mp3');
        }

        if (Math.floor(secInto5MinBlock) === 15 && lastAlert445Key !== currentBlockId) {
          lastAlert445Key = currentBlockId;
          playAudio('Go Go Go.mp3');
        }

        const elMain = document.getElementById('main-timer-text');
        let displaySec = 0;
        if (rem5MinSec >= 291 && rem5MinSec <= 300) {
          displaySec = rem5MinSec - 290;
        } else if (rem5MinSec > 0 && rem5MinSec <= 290) {
          displaySec = rem5MinSec;
        } else {
          displaySec = 0;
        }

        const m5 = Math.floor(displaySec / 60);
        const s5 = Math.floor(displaySec % 60);
        if (elMain) {
          elMain.innerText = `${String(m5).padStart(2, '0')}:${String(s5).padStart(2, '0')}`;
        }

        const mainIcon = document.getElementById('main-icon');
        const mainCard = document.getElementById('main-timer-card');
        
        const isSunActive = !(rem5MinSec <= 290 && rem5MinSec > 0);

        if (mainIcon) {
          mainIcon.src = isSunActive ? 'sun_icon.jpg' : 'moon_icon.jpg';
        }

        if (mainCard) {
          mainCard.classList.remove('yellow-state', 'glowing-state');
          if (secInto5MinBlock >= 10 && secInto5MinBlock < 15) {
            mainCard.classList.add('yellow-state');
          } else if (secInto5MinBlock >= 15) {
            mainCard.classList.add('glowing-state');
          }
        }

        // --- 2. BOTTOM TIMER ---
        const secInto30MinBlock = ((totalSecToday % 1800) + 1800) % 1800;
        const currentBottomBlockId = Math.floor(totalSecToday / 1800);

        // Audio Trigger for Bottom Timer Reset -> event.mp3 (Plays 5 seconds after reset)
        if (secInto30MinBlock >= 5 && lastBottomResetKey !== currentBottomBlockId) {
          lastBottomResetKey = currentBottomBlockId;
          playAudio('event.mp3');
        }

        const bottomCard = document.getElementById('bottom-timer-card');
        const bottomContainer = document.getElementById('bottom-indicator-container');

        const isIlluminated = secInto30MinBlock < 300;

        if (bottomCard) {
          if (isIlluminated) {
            bottomCard.classList.add('illuminated');
          } else {
            bottomCard.classList.remove('illuminated');
          }
        }

        if (bottomContainer) {
          if (isIlluminated) {
            bottomContainer.innerHTML = '<div class="now-badge">NOW</div>';
          } else {
            bottomContainer.innerHTML = '';
          }
        }

        let display30Sec;
        if (secInto30MinBlock < 300) {
          display30Sec = 300 - secInto30MinBlock;
        } else {
          display30Sec = 1800 - secInto30MinBlock;
        }

        const m30 = Math.floor(display30Sec / 60);
        const s30 = Math.floor(display30Sec % 60);
        const elT2 = document.getElementById('timer2-text');
        if (elT2) {
          elT2.innerText = `${String(m30).padStart(2, '0')}:${String(s30).padStart(2, '0')}`;
        }
      } catch (err) {
        console.error("Timer update error:", err);
      }
    }

    setInterval(updateTimers, 200);
    updateTimers();
  </script>
</body>
</html>
