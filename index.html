<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>24/7 Stream Overlay - Master Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: transparent; 
      font-family: 'Arial Black', Impact, sans-serif; 
      overflow: hidden; 
      width: 100vw; 
      height: 100vh; 
      color: #fff; 
    }

    /* RIGHT SIDEBAR: BANNERS & TIMERS */
    .right-sidebar { 
      position: absolute; 
      top: 20px; 
      right: 20px; 
      width: 380px; 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
      z-index: 10;
    }

    /* GLASSY METALLIC BLUE THEME */
    .glass-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(180deg, #1b385e 0%, #0d1e36 50%, #091322 100%);
      border: 3px solid #6b82a0;
      box-shadow: 
        0 0 0 1px #050a12,
        inset 0 1px 2px rgba(255, 255, 255, 0.6),
        inset 0 -2px 4px rgba(0, 0, 0, 0.8),
        0 8px 16px rgba(0, 0, 0, 0.6);
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 45%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 100%);
      border-radius: 12px 12px 100% 100% / 12px 12px 10px 10px;
      pointer-events: none;
      z-index: 3;
    }

    .banner-card { height: 75px; }
    .banner-bg { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      object-fit: cover; z-index: 1; opacity: 0.45; mix-blend-mode: overlay;
    }
    .marquee-wrapper { 
      position: relative; z-index: 2; width: 100%; height: 100%; 
      display: flex; align-items: center; overflow: hidden; white-space: nowrap; 
    }
    .marquee-text { 
      display: inline-block; font-size: 22px; font-weight: 900; color: #ffffff; 
      text-transform: uppercase; letter-spacing: 1px; text-shadow: 2px 2px 4px #000; 
      padding-left: 100%; animation: marquee 12s linear infinite; 
    }
    @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

    .timer-card { display: flex; align-items: center; justify-content: flex-start; gap: 14px; padding: 12px 16px; }
    .icon-box { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex-shrink: 0; z-index: 4; }
    .timer-icon { width: 100%; height: 100%; object-fit: contain; }

    .timer-main { background: linear-gradient(180deg, #ffd700 0%, #cca300 50%, #997a00 100%); border-color: #ffe680; }
    .timer-main .timer-text { font-size: 38px; font-weight: 900; color: #000000; z-index: 4; }
    .timer-secondary .timer-text { font-size: 28px; font-weight: 800; color: #ffffff; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; z-index: 4; }
    .timer-secondary .icon-box { width: 36px; height: 36px; }

    /* FAR LEFT PANEL: LAST SEEN / ÚLTIMO SPAWN */
    .left-sidebar {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 320px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }
    .last-seen-title {
      font-size: 20px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px;
      background: rgba(0,0,0,0.6);
      border-radius: 10px;
      border: 2px solid #555;
    }
    .section-header {
      font-size: 16px;
      padding: 6px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }
    .header-divine { background: #ffd700; color: #000; border: 2px solid #fff; }
    .header-eternal { background: #8a2be2; color: #fff; border: 2px solid #da70d6; }
    .header-secret { background: #333; color: #fff; border: 2px solid #777; }

    .pet-list { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; padding-left: 6px; }
    .pet-item { display: flex; align-items: center; justify-content: space-between; font-size: 14px; text-shadow: 1px 1px 2px #000; }
    .pet-info { display: flex; align-items: center; gap: 6px; }
    .pet-icon { width: 22px; height: 22px; object-fit: contain; }
    .pet-time { font-size: 12px; color: #ccc; }

    /* MIDDLE TOP: EGG ALERT SLIDING U-ARC CARDS */
    .egg-alert-container {
      position: absolute;
      top: 20px;
      left: 360px;
      right: 420px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 5;
    }
    
    .egg-card {
      width: 140px;
      height: 140px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      position: relative;
      box-shadow: 0 6px 12px rgba(0,0,0,0.7);
      transition: all 0.6s ease-in-out;
    }

    /* U-ARC vertical positioning based on index */
    .egg-card:nth-child(1) { transform: translateY(0px); }
    .egg-card:nth-child(2) { transform: translateY(20px); }
    .egg-card:nth-child(3) { transform: translateY(35px); }
    .egg-card:nth-child(4) { transform: translateY(35px); }
    .egg-card:nth-child(5) { transform: translateY(20px); }
    .egg-card:nth-child(6) { transform: translateY(0px); }

    /* CARD RARITY STYLES */
    .card-divine {
      background: linear-gradient(180deg, #ffe066 0%, #b8860b 100%);
      border: 3px solid #ffea9f;
      color: #000;
    }
    .card-eternal {
      background: linear-gradient(180deg, #4b0082 0%, #1a0033 100%);
      border: 3px solid #8a2be2;
      color: #fff;
    }
    .card-secret {
      background: linear-gradient(180deg, #2c2c2c 0%, #111111 100%);
      border: 3px solid #444444;
      color: #fff;
    }

    .egg-title { font-size: 13px; font-weight: 900; text-align: center; line-height: 1.1; }
    .egg-img { width: 50px; height: 50px; object-fit: contain; }
    .spawn-badge-now {
      background: #ff0000;
      color: #ffff00;
      font-weight: 900;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid #fff;
      text-transform: uppercase;
    }
    .spawn-badge-ago {
      font-weight: 900;
      font-size: 12px;
      color: #555;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }
  </style>
</head>
<body>

  <!-- LEFT SIDEBAR: LAST SEEN -->
  <div class="left-sidebar">
    <div class="last-seen-title">LAST SEEN / ÚLTIMO SPAWN</div>

    <div>
      <div class="section-header header-divine">🟡 Divine — Last Seen</div>
      <div class="pet-list" id="divine-list"></div>
    </div>

    <div>

  <div class="right-sidebar">

    <div class="glass-card timer-card timer-secondary">

      <div id="timer1-text" class="timer-text">30:00</div>

    <div class="glass-card timer-card timer-secondary">
      <div class="icon-box">
        <img class="timer-icon" src="game_icon2.jpg" alt="Event 2" onerror="this.style.display='none'">
      </div>
      <div id="timer2-text" class="timer-text">30:00</div>
    </div>
  </div>

    function renderLastSeen() {
      const fillList = (id, list) => {

        el.innerHTML = list.map(item => `

      }
