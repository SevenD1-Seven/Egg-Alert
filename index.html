<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>24/7 Stream Overlay - Master Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: url('noFilter.webp') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Arial Black', Impact, sans-serif; 
      overflow: hidden; 
      width: 100vw; 
      height: 100vh; 
      color: #fff; 
    }

    /* RIGHT SIDEBAR: BANNERS & TIMERS */
    .right-sidebar { 
      position: absolute; 
      top: 20px; 
      right: 20px; 
      width: 380px; 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
      z-index: 10;
    }

    /* GLASSY METALLIC BLUE THEME */
    .glass-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(180deg, #1b385e 0%, #0d1e36 50%, #091322 100%);
      border: 3px solid #6b82a0;
      box-shadow: 
        0 0 0 1px #050a12,
        inset 0 1px 2px rgba(255, 255, 255, 0.6),
        inset 0 -2px 4px rgba(0, 0, 0, 0.8),
        0 8px 16px rgba(0, 0, 0, 0.6);
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 45%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 100%);
      border-radius: 12px 12px 100% 100% / 12px 12px 10px 10px;
      pointer-events: none;
      z-index: 3;
    }

    .banner-card { height: 75px; }
    .banner-bg { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      object-fit: cover; z-index: 1; opacity: 0.45; mix-blend-mode: overlay;
    }
    .marquee-wrapper { 
      position: relative; z-index: 2; width: 100%; height: 100%; 
      display: flex; align-items: center; overflow: hidden; white-space: nowrap; 
    }
    .marquee-text { 
      display: inline-block; font-size: 22px; font-weight: 900; color: #ffffff; 
      text-transform: uppercase; letter-spacing: 1px; text-shadow: 2px 2px 4px #000; 
      padding-left: 100%; animation: marquee 12s linear infinite; 
    }
    @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

    .timer-card { display: flex; align-items: center; justify-content: flex-start; gap: 14px; padding: 12px 16px; }
    .icon-box { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex-shrink: 0; z-index: 4; }
    .timer-icon { width: 100%; height: 100%; object-fit: contain; }

    .timer-main { background: linear-gradient(180deg, #ffd700 0%, #cca300 50%, #997a00 100%); border-color: #ffe680; }
    .timer-main .timer-text { font-size: 38px; font-weight: 900; color: #000000; z-index: 4; }
    .timer-secondary .timer-text { font-size: 28px; font-weight: 800; color: #ffffff; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; z-index: 4; }
    .timer-secondary .icon-box { width: 36px; height: 36px; }
  </style>
</head>
<body>

  <!-- RIGHT SIDEBAR: BANNERS & TIMERS -->
  <div class="right-sidebar">
    <div class="glass-card banner-card">
      <img class="banner-bg" src="banner1_bg.gif" alt="" onerror="this.style.display='none'">
      <div class="marquee-wrapper">
        <div class="marquee-text">¿Buscas alguna fusión? Deja tu user y un comentario.</div>
      </div>
    </div>

    <div class="glass-card banner-card">
      <img class="banner-bg" src="banner2_bg.gif" alt="" onerror="this.style.display='none'">
      <div class="marquee-wrapper">
        <div class="marquee-text">Looking for a merge? Leave your user and a comment.</div>
      </div>
    </div>

    <!-- TOP 5-MIN LOOPING TIMER (Sun/Moon Switch & 5s Offset) -->
    <div class="glass-card timer-card timer-main">
      <div class="icon-box">
        <img id="main-icon" class="timer-icon" src="sun_icon.jpg" alt="Icon" onerror="this.style.display='none'">
      </div>
      <div id="main-timer-text" class="timer-text">05:00</div>
    </div>

    <!-- MIDDLE TIMER (30-Min Interval starting at :15 / :45 with 5s offset) -->
    <div class="glass-card timer-card timer-secondary">
      <div class="icon-box">
        <img class="timer-icon" src="game_icon1.jpg" alt="Event 1" onerror="this.style.display='none'">
      </div>
      <div id="timer1-text" class="timer-text">30:00</div>
    </div>

    <!-- BOTTOM TIMER (30-Min Interval starting at :00 / :30 with 5s offset) -->
    <div class="glass-card timer-card timer-secondary">
      <div class="icon-box">
        <img class="timer-icon" src="game_icon2.jpg" alt="Event 2" onerror="this.style.display='none'">
      </div>
      <div id="timer2-text" class="timer-text">30:00</div>
    </div>
  </div>

  <script>
    function updateTimers() {
      const now = new Date();
      const totalSecToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000;

      // --- 1. TOP 5-MIN TIMER (5-second offset) ---
      const shifted5MinSec = totalSecToday + 5;
      const secInto5MinBlock = shifted5MinSec % 300;
      const rem5MinSec = 300 - secInto5MinBlock;

      const m5 = Math.floor(rem5MinSec / 60);
      const s5 = Math.floor(rem5MinSec % 60);
      document.getElementById('main-timer-text').innerText = 
        `${String(m5).padStart(2, '0')}:${String(s5).padStart(2, '0')}`;

      // Sun/Moon Icon Toggle: Moon from 4:50 to 00:00, Sun from 5:00 to 4:51
      const mainIcon = document.getElementById('main-icon');
      if (rem5MinSec <= 290 && rem5MinSec > 0) {
        mainIcon.src = 'moon_icon.jpg';
      } else {
        mainIcon.src = 'sun_icon.jpg';
      }

      // --- 2. MIDDLE TIMER (30-Min Interval at :15 / :45 with 5s offset) ---
      const shifted15MinSec = totalSecToday + 5 - 900;
      const secInto15MinBlock = ((shifted15MinSec % 1800) + 1800) % 1800;
      const rem15MinSec = 1800 - secInto15MinBlock;

      const m15 = Math.floor(rem15MinSec / 60);
      const s15 = Math.floor(rem15MinSec % 60);
      document.getElementById('timer1-text').innerText = 
        `${String(m15).padStart(2, '0')}:${String(s15).padStart(2, '0')}`;

      // --- 3. BOTTOM TIMER (30-Min Interval at :00 / :30 with 5s offset) ---
      const shifted30MinSec = totalSecToday + 5;
      const secInto30MinBlock = shifted30MinSec % 1800;
      const rem30MinSec = 1800 - secInto30MinBlock;

      const m30 = Math.floor(rem30MinSec / 60);
      const s30 = Math.floor(rem30MinSec % 60);
      document.getElementById('timer2-text').innerText = 
        `${String(m30).padStart(2, '0')}:${String(s30).padStart(2, '0')}`;
    }

    setInterval(updateTimers, 200);
    updateTimers();
  </script>
</body>
</html>
