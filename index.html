<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>24/7 Stream Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; font-family: 'Arial Black', Impact, sans-serif; overflow: hidden; width: 100vw; height: 100vh; color: #fff; }
    .right-sidebar { position: absolute; top: 20px; right: 20px; width: 380px; display: flex; flex-direction: column; gap: 16px; }

    /* BANNERS */
    .banner-card { position: relative; height: 75px; border-radius: 12px; overflow: hidden; background-color: #111; border: 4px solid #00d2ff; box-shadow: inset 0 0 6px #0088cc, 0 0 10px rgba(0, 210, 255, 0.6); }
    .banner-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.6; }
    .marquee-wrapper { position: relative; z-index: 2; width: 100%; height: 100%; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
    .marquee-text { display: inline-block; font-size: 24px; font-weight: 900; color: #ff1100; text-transform: uppercase; letter-spacing: 1px; text-shadow: 2px 2px 4px #000, -1px -1px 0 #000; padding-left: 100%; animation: marquee 12s linear infinite; }
    @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

    /* TIMERS CONTAINER */
    .timers-container { display: flex; flex-direction: column; gap: 12px; background: rgba(0, 0, 0, 0.4); padding: 12px; border-radius: 12px; backdrop-filter: blur(4px); }
    .timer-card { display: flex; align-items: center; justify-content: flex-start; gap: 14px; background: rgba(20, 20, 30, 0.75); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 10px; padding: 8px 14px; }
    .icon-box { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex-shrink: 0; }
    .timer-icon { width: 100%; height: 100%; object-fit: contain; }

    /* MAIN 5-MIN TIMER */
    .timer-main { border: 3px solid #ffcc00; background: rgba(255, 204, 0, 0.9); padding: 12px 16px; }
    .timer-main .timer-text { font-size: 38px; font-weight: 900; color: #000000; }

    /* SECONDARY 30-MIN TIMERS */
    .timer-secondary .timer-text { font-size: 28px; font-weight: 800; color: #ffffff; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; }
    .timer-secondary .icon-box { width: 36px; height: 36px; }
  </style>
</head>
<body>

  <div class="right-sidebar">
    
    <!-- BANNER 1 (SPANISH) -->
    <div class="banner-card">
      <img class="banner-bg" src="banner1_bg.gif" alt="" onerror="this.style.display='none'">
      <div class="marquee-wrapper"><div class="marquee-text">¿Buscas alguna fusión? Deja tu user y un comentario.</div></div>
    </div>

    <!-- BANNER 2 (ENGLISH) -->
    <div class="banner-card">
      <img class="banner-bg" src="banner2_bg.gif" alt="" onerror="this.style.display='none'">
      <div class="marquee-wrapper"><div class="marquee-text">Looking for a merge? Leave your user and a comment.</div></div>
    </div>

    <!-- TIMERS SECTION -->
    <div class="timers-container">
      <div class="timer-card timer-main">
        <div class="icon-box"><img id="main-icon" class="timer-icon" src="sun_icon.jpg" alt="Main Icon" onerror="this.style.display='none'"></div>
        <div id="main-timer-text" class="timer-text">00:10.00</div>
      </div>
      <div class="timer-card timer-secondary">
        <div class="icon-box"><img class="timer-icon" src="game_icon1.jpg" alt="Event 1" onerror="this.style.display='none'"></div>
        <div id="timer1-text" class="timer-text">30:00.00</div>
      </div>
      <div class="timer-card timer-secondary">
        <div class="icon-box"><img class="timer-icon" src="game_icon2.jpg" alt="Event 2" onerror="this.style.display='none'"></div>
        <div id="timer2-text" class="timer-text">30:00.00</div>
      </div>
    </div>

  </div>

  <script>
    const SUN_ICON = 'sun_icon.jpg';
    const MOON_ICON = 'moon_icon.jpg';
    
    // Your fine-tuned offset
    const streamDelaySec = -9.81; 

    function formatTimeWithDecimals(totalSec) {
      if (totalSec < 0) totalSec = 0;
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      const secInt = Math.floor(s);
      const dec = (s - secInt).toFixed(2).substring(1); // gets ".XX"
      return String(m).padStart(2, '0') + ':' + String(secInt).padStart(2, '0') + dec;
    }

    function tick() {
      try {
        const d = new Date();
        const totalSec = (d.getHours() * 3600) + (d.getMinutes() * 60) + (d.getSeconds() + (d.getMilliseconds() / 1000)) - streamDelaySec;

        const secIn30Min = totalSec % 1800;
        const secIn5Min = totalSec % 300;

        // Bottom Timer: Resets 5 seconds before every hour and half-hour
        let t2Rem = 1795 - secIn30Min;
        if (t2Rem < 0) t2Rem += 1800;
        document.getElementById('timer2-text').innerText = formatTimeWithDecimals(t2Rem);

        // Middle Timer: Resets at :15 and :45
        let t1Rem = 895 - secIn30Min;
        if (t1Rem < 0) t1Rem += 1800;
        document.getElementById('timer1-text').innerText = formatTimeWithDecimals(t1Rem);

        // Main 5-Minute Timer
        let mainRem = 295 - secIn5Min;
        if (mainRem < 0) mainRem += 300;

        const iconEl = document.getElementById('main-icon');
        const textEl = document.getElementById('main-timer-text');

        if (mainRem > 290) {
          if (!iconEl.src.includes(SUN_ICON)) iconEl.src = SUN_ICON;
          const sunCount = mainRem - 290;
          textEl.innerText = '00:' + String(sunCount).toFixed(2).padStart(5, '0');
        } else {
          if (!iconEl.src.includes(MOON_ICON)) iconEl.src = MOON_ICON;
          textEl.innerText = formatTimeWithDecimals(mainRem);
        }

      } catch (err) {
        console.error("Tick error:", err);
      }
    }

    // High frequency update for smooth decimal ticking
    setInterval(tick, 50);
    tick();
  </script>
</body>
</html>
